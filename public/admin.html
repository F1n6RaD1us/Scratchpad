<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>管理后台 · 共享文档</title>
    <link rel="stylesheet" href="/assets/site.css" />
    <script src="/assets/theme.js"></script>
</head>

<body class="glow">
    <header class="topbar">
        <a class="logo" href="/">
            <span class="logo-mark"><i class="icon i-file"></i></span>
            <span class="logo-text">共享文档</span>
        </a>
        <span class="pill editing"><i class="icon i-lock"></i><span class="pill-label">管理后台</span></span>
        <span class="spacer"></span>
        <button class="btn" id="logoutBtn" title="退出管理后台" hidden><i class="icon i-logout"></i><span>退出</span></button>
        <button class="btn btn-icon" onclick="toggleTheme()" title="切换夜间模式"><i class="icon i-theme"></i></button>
    </header>

    <main class="admin">
        <form class="login-card" id="loginForm" hidden>
            <span class="icon-tile"><i class="icon i-lock"></i></span>
            <h1>管理后台</h1>
            <p>输入管理密码（Pages 项目里设置的 <code>ADMIN_PASSWORD</code>）。</p>
            <input type="password" id="password" placeholder="管理密码" autocomplete="current-password" required />
            <p class="login-error" id="loginError" hidden></p>
            <button class="btn btn-primary" type="submit"><span>进入</span></button>
        </form>

        <section id="panel" hidden>
            <div class="admin-head">
                <h1>全部文档和文档集 <small id="count"></small></h1>
                <span class="spacer"></span>
                <label class="search">
                    <i class="icon i-search"></i>
                    <input type="search" id="search" placeholder="搜索标题、名称或 ID" />
                </label>
                <button class="btn btn-outline btn-icon" id="refreshBtn" title="刷新"><i class="icon i-refresh"></i></button>
            </div>
            <!-- 图片不会自动删除：上传超过一年的只在这里列出来，点按钮才删 -->
            <div class="image-stats" id="imageStats" hidden>
                <i class="icon i-image"></i>
                <span class="image-stats-text" id="imageStatsText"></span>
                <button class="btn btn-outline btn-danger" id="purgeImagesBtn" hidden><i class="icon i-trash"></i><span>删除过期图片</span></button>
            </div>
            <ul class="doc-list admin-list" id="docList"></ul>
            <p class="hint">删除是永久的：文档、全部历史版本和上传的图片都会删掉，删文档集会连里面的文档一起删掉，只能用 D1 的「时间旅行」把整个数据库恢复到删除之前。</p>
        </section>
    </main>

    <script>
        // 密码只存在这个标签页里（sessionStorage），关掉标签页就要重新输入
        const PASSWORD_KEY = 'shareddoc:admin';
        const $ = (id) => document.getElementById(id);
        let docs = [];
        let sets = [];
        let images = null; // 上传到本站的图片统计，见 /api/admin/docs

        async function api(path, method = 'GET') {
            const password = sessionStorage.getItem(PASSWORD_KEY) || '';
            const res = await fetch(path, {
                method,
                headers: { authorization: `Bearer ${encodeURIComponent(password)}` },
                signal: AbortSignal.timeout(20000),
            });
            const data = await res.json().catch(() => ({}));
            return { ok: res.ok, status: res.status, data };
        }

        function showLogin(message) {
            $('panel').hidden = $('logoutBtn').hidden = true;
            $('loginForm').hidden = false;
            $('loginError').hidden = !message;
            $('loginError').textContent = message || '';
            $('password').focus();
        }

        async function load() {
            const { ok, status, data } = await api('/api/admin/docs').catch(() => ({ data: { error: '网络超时或服务器没有响应' } }));
            if (!ok) {
                if (status === 401) sessionStorage.removeItem(PASSWORD_KEY);
                showLogin(data.error || `加载失败（${status}）`);
                return;
            }
            docs = data.docs;
            sets = data.sets;
            images = data.images;
            $('loginForm').hidden = true;
            $('panel').hidden = $('logoutBtn').hidden = false;
            render();
        }

        function button(tag, className, icon, label, title) {
            const el = document.createElement(tag);
            el.className = `btn ${className}`;
            el.innerHTML = `<i class="icon ${icon}"></i>${label ? `<span>${label}</span>` : ''}`;
            if (title) el.title = title;
            return el;
        }

        const formatSize = (bytes) => (bytes < 1024 * 1024 ? `${Math.ceil(bytes / 1024)} KB` : `${Number((bytes / 1024 / 1024).toFixed(1))} MB`);

        function renderImages() {
            $('imageStats').hidden = !images.count;
            if (!images.count) return;
            const expired = images.expiredCount > 0;
            $('imageStats').classList.toggle('expired', expired);
            $('purgeImagesBtn').hidden = !expired;
            $('imageStatsText').textContent = `上传到本站的图片：${images.count} 张，共 ${formatSize(images.bytes)}（上限 ${formatSize(images.limit)}）。`
                + (expired
                    ? `其中 ${images.expiredCount} 张已上传超过一年（共 ${formatSize(images.expiredBytes)}），可以删除。`
                    : '没有上传超过一年的图片。');
        }

        const pagePath = (d) => `/${d.isSet ? 'set' : 'doc'}/${d.id}`;
        const viewUrl = (d) => `${location.origin}${pagePath(d)}`;
        const editUrl = (d) => `${viewUrl(d)}?key=${encodeURIComponent(d.editKey)}`;

        // 打开按钮和它右边的复制按钮拼成一组，一眼能看出复制的是哪个链接
        function linkPair(icon, label, url, copyTitle) {
            const open = button('a', 'btn-outline', icon, label);
            open.href = url;
            open.target = '_blank';

            const copy = button('button', 'btn-outline btn-icon', 'i-copy', '', copyTitle);
            copy.onclick = async () => {
                try {
                    await navigator.clipboard.writeText(url);
                } catch {
                    prompt('浏览器不允许自动复制，请手动复制：', url);
                    return;
                }
                copy.classList.add('active');
                copy.title = '已复制';
                clearTimeout(copy.copiedTimer);
                copy.copiedTimer = setTimeout(() => {
                    copy.classList.remove('active');
                    copy.title = copyTitle;
                }, 1500);
            };

            const pair = document.createElement('span');
            pair.className = 'btn-pair';
            pair.append(open, copy);
            return pair;
        }

        // 列表里的一行：标题、概要、编辑 / 只读链接、删除。toggle 是行首展开 / 收起文档集的按钮（单独的文档放一个同样宽的空位，标题才对齐）
        function row(d, toggle) {
            const title = document.createElement('a');
            title.className = 'title';
            title.href = pagePath(d);
            title.target = '_blank';
            title.textContent = d.title || '无标题';
            title.classList.toggle('untitled', !d.title);
            if (d.isSet) title.prepend(Object.assign(document.createElement('i'), { className: 'icon i-folder' }));

            const meta = document.createElement('small');
            meta.textContent = (d.isSet
                ? [d.id, `${d.docs} 篇文档`, `更新于 ${new Date(d.updatedAt).toLocaleString()}`]
                : [
                    d.id,
                    `更新于 ${new Date(d.updatedAt).toLocaleString()}`,
                    `${d.length} 字`,
                    `${d.versions} 个历史版本`,
                    d.images && `${d.images} 张图片`,
                ]).filter(Boolean).join(' · ');

            const info = document.createElement('div');
            info.className = 'doc-info';
            info.append(title, meta);

            const edit = linkPair('i-pencil', '编辑', editUrl(d), '复制编辑链接（拿到的人可以修改）');
            const view = linkPair('i-eye', '只读', viewUrl(d), '复制只读链接（可以随便分享）');

            const remove = button('button', 'btn-icon btn-danger', 'i-trash', '', '永久删除');
            remove.onclick = async () => {
                const what = d.isSet
                    ? `文档集「${d.title}」和里面的 ${d.docs} 篇文档？\n这些文档的全部历史版本和上传的图片都会删掉`
                    : `「${d.title || d.id}」？\n文档、全部历史版本和上传的图片都会删掉`;
                if (!confirm(`永久删除${what}，拿着链接的人也打不开了。`)) return;
                remove.disabled = true;
                const res = await api(`/api/admin/${d.isSet ? 'sets' : 'docs'}/${d.id}`, 'DELETE').catch(() => null);
                // 404 说明已经不在了，同样从列表里去掉
                if (res?.ok || res?.status === 404) {
                    if (d.isSet || d.images || d.setId) return load(); // 连带删了文档、图片，或者文档集的篇数变了，重新加载
                    docs = docs.filter((x) => x.id !== d.id);
                    render();
                } else {
                    remove.disabled = false;
                    alert(`删除失败：${res?.data.error || '网络超时或服务器没有响应'}`);
                }
            };

            const div = document.createElement('div');
            div.className = 'admin-row';
            if (toggle) div.append(toggle);
            div.append(info, edit, view, remove);
            return div;
        }

        // 展开着的文档集。默认都收起；只存在内存里，搜索、删除后重新显示列表时保持原样
        const expanded = new Set();

        function setGroup(set, kids, autoOpen) {
            const li = document.createElement('li');
            li.className = 'set-group';
            const toggle = button('button', 'btn-icon set-toggle', 'i-chevron', '', '展开 / 收起里面的文档');
            const setOpen = (open) => {
                li.classList.toggle('open', open);
                toggle.setAttribute('aria-expanded', String(open));
            };
            setOpen(expanded.has(set.id) || autoOpen);
            toggle.onclick = () => {
                const open = !li.classList.contains('open');
                if (open) expanded.add(set.id);
                else expanded.delete(set.id);
                setOpen(open);
            };
            toggle.disabled = !kids.length;

            const ul = document.createElement('ul');
            ul.className = 'set-children';
            ul.append(...kids.map((d) => {
                const kid = document.createElement('li');
                kid.append(row(d));
                return kid;
            }));
            li.append(row(set, toggle), ul);
            return li;
        }

        function render() {
            renderImages();
            const q = $('search').value.trim().toLowerCase();
            const match = (d) => d.title.toLowerCase().includes(q) || d.id.toLowerCase().includes(q);

            // 文档集里的文档收在文档集下面，按创建时间排（和文档集目录里的顺序一样）；
            // 最外层只放文档集和单独的文档，按更新时间排
            const kidsOf = new Map(sets.map((s) => [s.id, []]));
            const loose = [];
            for (const d of docs) (kidsOf.get(d.setId) ?? loose).push(d);
            for (const kids of kidsOf.values()) kids.sort((a, b) => (a.createdAt ?? 0) - (b.createdAt ?? 0));

            // 搜索时：文档集名称匹配就列出整个文档集；只有集里的文档匹配，就只列出这几篇，并自动展开
            const entries = [];
            for (const set of sets) {
                const kids = kidsOf.get(set.id);
                const matched = q ? kids.filter(match) : [];
                if (q && !match(set) && !matched.length) continue;
                entries.push({ at: set.updatedAt, el: () => setGroup({ ...set, isSet: true }, q && !match(set) ? matched : kids, matched.length > 0) });
            }
            for (const d of loose) {
                if (q && !match(d)) continue;
                entries.push({
                    at: d.updatedAt,
                    el: () => {
                        const li = document.createElement('li');
                        li.append(row(d, Object.assign(document.createElement('span'), { className: 'set-toggle' })));
                        return li;
                    },
                });
            }
            entries.sort((a, b) => b.at - a.at);

            const found = q ? sets.filter(match).length + docs.filter(match).length : 0;
            $('count').textContent = q ? `找到 ${found} 项` : `${sets.length} 个文档集 · ${docs.length} 篇文档`;

            if (entries.length === 0) {
                const li = document.createElement('li');
                li.className = 'empty';
                li.textContent = sets.length || docs.length ? '没有匹配的文档' : '数据库里还没有文档';
                $('docList').replaceChildren(li);
                return;
            }
            $('docList').replaceChildren(...entries.map((e) => e.el()));
        }

        $('loginForm').onsubmit = (e) => {
            e.preventDefault();
            sessionStorage.setItem(PASSWORD_KEY, $('password').value);
            $('password').value = '';
            load();
        };

        $('logoutBtn').onclick = () => {
            sessionStorage.removeItem(PASSWORD_KEY);
            docs = [];
            sets = [];
            $('docList').replaceChildren();
            showLogin();
        };

        $('purgeImagesBtn').onclick = async () => {
            if (!confirm(`永久删除 ${images.expiredCount} 张上传超过一年的图片（共 ${formatSize(images.expiredBytes)}）？\n引用这些图片的文档里，图片会显示不出来。`)) return;
            $('purgeImagesBtn').disabled = true;
            const res = await api('/api/admin/images', 'DELETE').catch(() => null);
            $('purgeImagesBtn').disabled = false;
            if (!res?.ok) return alert(`删除失败：${res?.data.error || '网络超时或服务器没有响应'}`);
            alert(`已删除 ${res.data.deleted} 张图片`);
            load(); // 重新统计，各文档的图片数也跟着变
        };

        $('search').oninput = render;
        $('refreshBtn').onclick = load;

        if (sessionStorage.getItem(PASSWORD_KEY)) load();
        else showLogin();
    </script>
</body>

</html>
