# 本地调试（npm run dev）用的配置。
# 线上是用 build-zip.bat 打包、在 Dashboard 上传的，不读这个文件，绑定在 Dashboard 里配。
# 本地用的是模拟数据库，下面两个 ID 随便填也能跑。
#
# 静态资源只发布 public/，仓库根目录下的 README、脚本等都不会被上传。

name = "suolk-docs"
pages_build_output_dir = "public"
compatibility_date = "2026-09-01"

# 文档数据（D1 / SQLite）。表结构由 lib/store.js 自动创建
[[d1_databases]]
binding = "DB"
database_name = "self-page"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# 早期版本的数据存在这里。访问到 D1 里还没有的文档时会自动搬过去（只读，不再写入）
[[kv_namespaces]]
binding = "DOCS"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
